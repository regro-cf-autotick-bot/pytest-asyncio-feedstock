# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 0.26.0

package:
  name: pytest-asyncio
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/p/pytest-asyncio/pytest_asyncio-${{ version }}.tar.gz
    sha256: c4df2a697648241ff39e7f0e4a73050b03f123f760673956cf0d72a4990e312f
    target_directory: dist
    patches:
      - 0000-no-setuptools-77.patch
  - url: https://github.com/pytest-dev/pytest-asyncio/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 7bcd830bed05bc7d10068c49a844b8062af84537b846d61310f3b939ab0d013f
    target_directory: src

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm >=6.2
  run:
    - pytest >=8.2,<9
    - python >=${{ python_min }}
    - typing_extensions>=4.12

tests:
  - python:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - 3.13.*
      imports: pytest_asyncio
  - files:
      recipe:
        - run_test.py
      source:
        - src/tests/
        - src/setup.cfg
    requirements:
      run:
        - coverage
        - hypothesis >=5.7.1
        - pytest-trio
        - python ${{ python_min }}.*
    script:
      - python run_test.py

about:
  license: Apache-2.0
  license_file: dist/LICENSE
  summary: Pytest support for asyncio
  homepage: http://github.com/pytest-dev/pytest-asyncio
  repository: https://github.com/pytest-dev/pytest-asyncio

extra:
  recipe-maintainers:
    - sodre
    - bollwyvl
