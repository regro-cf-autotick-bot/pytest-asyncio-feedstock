# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"

package:
  name: pytest-asyncio
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/p/pytest-asyncio/pytest_asyncio-${{ version }}.tar.gz
    sha256: c609a64a2a8768462d0c99811ddb8bd2583c33fd33cf7f21af1c142e824ffb57
    target_directory: dist
  - url: https://github.com/pytest-dev/pytest-asyncio/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 8c2f599c88c9417b539628c7dc538c465829c31d634e39e1972f6dccd71b31a5
    target_directory: src

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=77.0
    - setuptools-scm >=6.2
  run:
    - pytest >=8.2,<9
    - python >=${{ python_min }}
    # needed for <3.11
    - typing_extensions >=4.12
    # needed for <3.13
    - backports.asyncio.runner >=1.1,<2

tests:
  - python:
      imports: pytest_asyncio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - 3.13.*
  - files:
      recipe:
        - run_test.py
      source:
        - src/tests/
    requirements:
      run:
        - coverage
        - hypothesis >=5.7.1
        - python ${{ python_min }}.*
    script:
      interpreter: python
      file: run_test.py

about:
  license: Apache-2.0
  license_file: dist/LICENSE
  summary: Pytest support for asyncio
  homepage: http://github.com/pytest-dev/pytest-asyncio
  repository: https://github.com/pytest-dev/pytest-asyncio

extra:
  recipe-maintainers:
    - sodre
    - bollwyvl
